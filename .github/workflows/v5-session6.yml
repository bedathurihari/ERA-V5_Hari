name: Session 6 Assignment 6 Evidence
on:
  push:
    branches: [main]
    paths:
      - 'Session 6/Assignment 6/system.py'
      - 'Session 6/Assignment 6/run_demo.py'
      - 'Session 6/Assignment 6/test_system.py'
      - '.github/workflows/v5-session6.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run execution demonstration
        working-directory: Session 6/Assignment 6
        run: python run_demo.py
      - name: Run invariant tests
        working-directory: Session 6/Assignment 6
        run: python -m unittest -v test_system.py
      - name: Regenerate evidence after tests
        working-directory: Session 6/Assignment 6
        run: python run_demo.py
      - name: Commit generated evidence artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Session 6/Assignment 6/submission_artifacts"
          git diff --cached --quiet || (git commit -m "Generate Session 6 evidence from verified execution" && git push)
